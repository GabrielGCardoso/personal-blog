# Site
name: "Gabriel G. Cardoso"
title: "Gabriel G. Cardoso"
description: "Technical Blog by Gabriel G. Cardoso"
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
baseurl: ""
include: ["_pages"]
permalink: /:title/

url: "https://gabrielgcardoso.dev"

# Authors
authors:
  gabriel:
    name: Gabriel G. Cardoso
    display_name: Gabriel G. Cardoso
    avatar: assets/images/gabriel.jpg
    description: "Sistemas distribuídos em produção, performance, observabilidade e como fazer tudo funcionar sem impactar o cliente."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-gist
  - jekyll-embed-urls
  - jekyll-linkpreview
  - jekyll-mermaid
  # - jekyll-compress-images

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-gist
  - jekyll-embed-urls
  - jekyll-linkpreview
  # - jekyll-compress-images

gist:
  noscript: false

# compress_images:
#   images_path: "assets/images/**/*.{gif,png,jpg,jpeg,svg}"

# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 9
paginate_path: /page:num/
    
# Other
markdown: kramdown

mermaid:
  src: 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
# adsense: "disabled"
# adsense-data-ad-client: "ca-pub-3412143450191416"
# adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "enabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock, docker-compose.yml]

embed:
# Extra elements to remove
  scrub:
  - form
  - input
  - textarea
  - button
  - fieldset
  - select
  - option
  - optgroup
  - canvas
  - area
  - map
